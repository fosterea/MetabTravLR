name: Spaceship tests

# Scoped to the Python package on purpose. This used to be `on: [push]`, which meant every
# push — including web-app-only pushes that just redeploy viz/ — ran the suite and emailed a
# failure notification even though nothing Python had changed. Now it only runs when something
# it actually tests changes, and can always be started by hand from the Actions tab.
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'setup.py'
      - '.github/workflows/python-package-conda.yml'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 8

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    - name: Add conda to system path
      run: |
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        eval "$(conda shell.bash hook)"
        conda init bash
        source ~/.bashrc
        conda activate base
        pip install --user setuptools
        pip install uv
        uv pip install pytest --system
        uv pip install -r requirements.txt --system
    - name: Test with pytest
      run: |
        eval "$(conda shell.bash hook)"
        conda init bash
        source ~/.bashrc
        conda activate base
        pytest -vv -p no:warnings
