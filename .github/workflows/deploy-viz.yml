# Builds the viz/ single-page app and deploys it to GitHub Pages.
#
# One-time setup (Foster, in the GitHub repo UI):
#   Settings → Pages → "Build and deployment" → Source: **GitHub Actions**.
# After that, every push to `release` that touches viz/ redeploys automatically; you can also
# run it manually from the Actions tab ("Run workflow"). The site publishes at
#   https://fosterea.github.io/MetabTravLR/
# The app is fully static (vite `base: './'`), and `viz/public/data/` is bundled into the
# build, so there is no separate data upload and nothing server-side to run.
name: Deploy viz to GitHub Pages

on:
  push:
    branches: [release]
    paths:
      - 'viz/**'
      - '.github/workflows/deploy-viz.yml'
  workflow_dispatch:

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viz
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viz/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viz/dist # relative to the repo root, not working-directory

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
